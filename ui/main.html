<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Asistemis</title>
<style>
/*BASE*/
.app { display: flex; }

/* ---------- barra lateral ---------- */
.side { width: 212px; flex: none; display: flex; flex-direction: column; padding: 14px 12px 14px;
  background: rgba(255,255,255,.35); box-shadow: inset -1px 0 0 var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 18px; font: 600 16px "Segoe UI Variable Display", "Segoe UI", sans-serif; }
.brand img { width: 28px; height: 28px; border-radius: 8px; pointer-events: none; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav button { display: flex; align-items: center; gap: 11px; height: 38px; padding: 0 12px; border-radius: 10px;
  background: transparent; font-size: 13px; font-weight: 600; color: var(--muted); text-align: left; }
nav button svg { flex: none; opacity: .75; }
nav button:hover { background: rgba(255,255,255,.55); color: var(--ink); }
nav button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08), inset 0 0 0 1px var(--line); }
nav button.on svg { opacity: 1; }
.badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 11px;
  display: grid; place-items: center; background: rgba(15,17,22,.07); color: var(--muted); }
.badge:empty { display: none; }
.grow { flex: 1; align-self: stretch; }
.power { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 12px; border-radius: 10px;
  background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; font-size: 12.5px; }
.power:hover { background: #fff; }
.power .dot { width: 8px; height: 8px; }
.power small { margin-left: auto; font-size: 10.5px; color: var(--faint); font-weight: 600; }

/* ---------- contenido ---------- */
.content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.bar { display: flex; align-items: center; gap: 6px; height: 54px; padding: 0 10px 0 22px; flex: none; }
.bar h1 { margin: 0; font: 600 19px "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -.01em; }
.win { width: 34px; height: 30px; border-radius: 8px; background: transparent; color: var(--muted); display: grid; place-items: center; }
.win:hover { background: rgba(15,17,22,.07); color: var(--ink); }
.win.close:hover { background: #e5484d; color: #fff; }
.view { flex: 1; display: none; flex-direction: column; min-height: 0; }
.view.on { display: flex; }

.tools { display: flex; align-items: center; gap: 10px; padding: 0 22px 12px; }
.search { flex: 1; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 17px;
  background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 1px var(--line); color: var(--faint); }
.search input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; color: var(--ink); user-select: text; }
.chip { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; font-size: 12px;
  font-weight: 600; color: var(--muted); background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.chip:hover { color: var(--ink); }
.chip.on { color: var(--ink); background: rgba(255,255,255,.75); }
.count { font-size: 12px; color: var(--faint); }
.hint { font-size: 12px; color: var(--muted); }
.hint b { color: var(--ink); font-weight: 600; }

/* ---------- notas (chat) ---------- */
.list { flex: 1; overflow-y: auto; padding: 4px 26px 14px; display: flex; flex-direction: column; gap: 6px; user-select: text; }
.list::-webkit-scrollbar, .cards::-webkit-scrollbar, .chat::-webkit-scrollbar { width: 10px; }
.list::-webkit-scrollbar-thumb, .cards::-webkit-scrollbar-thumb, .chat::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,.15); border-radius: 5px; border: 3px solid transparent; background-clip: padding-box; }
.day { align-self: center; margin: 14px 0 6px; padding: 3px 12px; border-radius: 10px; font-size: 11.5px; font-weight: 600;
  color: var(--muted); background: rgba(255,255,255,.6); box-shadow: inset 0 0 0 1px var(--line); text-transform: capitalize; }
.note { align-self: flex-end; max-width: 72%; display: flex; flex-direction: column; align-items: flex-end; }
.bubble { padding: 9px 14px; border-radius: 16px 16px 5px 16px; background: var(--ink); color: #fff; line-height: 1.5;
  white-space: pre-wrap; word-wrap: break-word; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.note.order .bubble { background: rgba(124,92,255,.12); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(124,92,255,.25); }
.label { display: block; font-size: 10.5px; font-weight: 700; color: var(--violet); margin-bottom: 2px; letter-spacing: .02em; }
.meta { display: flex; align-items: center; gap: 4px; margin-top: 3px; font-size: 11px; color: var(--faint); min-height: 22px; }
.acts { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.note:hover .acts { opacity: 1; }
.mini { height: 22px; padding: 0 8px; border-radius: 11px; background: rgba(255,255,255,.8); font-size: 11px; font-weight: 600;
  color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.mini:hover { color: var(--ink); background: #fff; }
.mini.danger { color: #fff; background: var(--red); box-shadow: none; }
.action { align-self: center; display: flex; align-items: center; gap: 7px; padding: 4px 12px; border-radius: 12px; font-size: 12px; color: var(--muted); }
.action svg { flex: none; opacity: .7; }
.action b { color: var(--ink); font-weight: 600; }
.action .t { color: var(--faint); font-size: 11px; }
.action.link { cursor: pointer; }
.action.link:hover { background: rgba(255,255,255,.6); }
.tag { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: rgba(15,17,22,.07); color: var(--ink); }
mark { background: rgba(250,204,21,.45); color: inherit; border-radius: 3px; padding: 0 1px; }
.note mark { background: rgba(250,204,21,.7); color: var(--ink); }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 340px; }
.empty b { display: block; color: var(--ink); font: 600 16px "Segoe UI Variable Display", "Segoe UI", sans-serif; margin-bottom: 4px; }

.compose { margin: 0 22px 16px; display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 16px;
  background: var(--glass-strong); border-radius: 20px; box-shadow: inset 0 0 0 1px var(--line), 0 2px 10px rgba(0,0,0,.05); flex: none; }
textarea, .add input { flex: 1; border: 0; outline: 0; resize: none; background: transparent; font: inherit; font-size: 13.5px;
  color: var(--ink); max-height: 140px; padding: 7px 0; user-select: text; }
textarea::placeholder, .add input::placeholder { color: var(--faint); }
.send { width: 36px; height: 36px; border-radius: 18px; background: var(--ink); color: #fff; display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .3; cursor: default; }

/* ---------- tareas (tablero) ---------- */
.board { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 0 22px 18px; }
.col { display: flex; flex-direction: column; min-height: 0; border-radius: 14px; background: rgba(255,255,255,.38);
  box-shadow: inset 0 0 0 1px var(--line); transition: background .15s, box-shadow .15s; }
.col.over { background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 2px rgba(37,99,235,.45); }
.colhead { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; font-weight: 600; font-size: 13px; }
.colhead .dot { width: 8px; height: 8px; box-shadow: none; }
.col[data-status="pendiente"] .colhead .dot { background: #f59e0b; }
.col[data-status="progreso"] .colhead .dot { background: var(--blue); }
.col[data-status="hecha"] .colhead .dot { background: var(--green); }
.colhead .n { margin-left: auto; font-size: 11.5px; color: var(--faint); }
.add { display: flex; align-items: center; gap: 6px; margin: 0 10px 8px; padding: 2px 6px 2px 12px; border-radius: 10px;
  background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 1px var(--line); }
.add input { padding: 7px 0; font-size: 13px; }
.add button { width: 26px; height: 26px; border-radius: 13px; background: var(--ink); color: #fff; display: grid; place-items: center; }
.cards { flex: 1; overflow-y: auto; padding: 2px 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.card { padding: 10px 12px 11px; border-radius: 12px; background: rgba(255,255,255,.9); cursor: grab;
  box-shadow: 0 1px 2px rgba(0,0,0,.06), inset 0 0 0 1px var(--line); transition: transform .12s, box-shadow .12s; }
.card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.09), inset 0 0 0 1px var(--line); }
.card.dragging { opacity: .45; }
.card .top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.num { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .02em; }
.card .date { font-size: 11px; color: var(--faint); }
.card .cacts { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.card:hover .cacts { opacity: 1; }
.card .cacts button { height: 20px; min-width: 22px; padding: 0 6px; border-radius: 6px; background: rgba(15,17,22,.06); font-size: 11px; font-weight: 700; color: var(--muted); }
.card .cacts button:hover { background: rgba(15,17,22,.12); color: var(--ink); }
.card .cacts button.danger { background: var(--red); color: #fff; }
.card .text { font-size: 13px; line-height: 1.45; word-wrap: break-word; user-select: text; }
.col[data-status="hecha"] .card .text { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(0,0,0,.25); }
.colempty { margin: 18px 8px; text-align: center; font-size: 12px; color: var(--faint); }

/* ---------- Claude (igual que el panel) ---------- */
.chat { flex: 1; overflow-y: auto; padding: 4px 26px 12px; display: flex; flex-direction: column; gap: 10px; user-select: text; }
.msg { max-width: 76%; padding: 9px 14px; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; animation: enter .2s both; }
.msg.you { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 5px; }
.msg.claude { align-self: flex-start; background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--line); border-bottom-left-radius: 5px; white-space: normal; }
.msg.error { align-self: flex-start; background: rgba(229,72,77,.1); color: #b4232a; }
.msg.meta { align-self: center; background: none; color: var(--faint); font-size: 11.5px; padding: 2px; }
.src { display: block; font-size: 10.5px; opacity: .6; margin-bottom: 2px; }
.msg code { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; background: rgba(0,0,0,.06); padding: 1px 4px; border-radius: 4px; }
.msg p { margin: 0 0 6px; } .msg p:last-child { margin: 0; }
.msg ul { margin: 2px 0 6px; padding-left: 18px; } .msg ul:last-child { margin-bottom: 0; }
.status { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 10px; border-radius: 15px;
  background: rgba(255,255,255,.6); box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; color: var(--muted); }
.status .dot { width: 7px; height: 7px; box-shadow: none; }
</style>
</head>
<body>
<div class="glass app">
  <aside class="side">
    <div class="brand pywebview-drag-region"><img src="%ICON%" alt=""><span class="pywebview-drag-region">Asistemis</span></div>
    <nav>
      <button data-view="notes" class="on">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Notas<span class="badge" id="nNotes"></span></button>
      <button data-view="tasks">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/></svg>
        Tareas<span class="badge" id="nTasks"></span></button>
      <button data-view="claude">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/></svg>
        Claude</button>
    </nav>
    <div class="grow pywebview-drag-region"></div>
    <button class="power" id="power" title="Encender / apagar"><span class="dot" id="pdot"></span><span id="ptext">…</span><small>Ctrl+Alt+N</small></button>
  </aside>

  <div class="content">
    <header class="bar">
      <h1 class="pywebview-drag-region" id="title">Notas</h1>
      <div class="grow pywebview-drag-region"></div>
      <button class="win" title="Minimizar" onclick="pywebview.api.minimize()">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="win close" title="Cerrar (Asistemis sigue funcionando)" onclick="pywebview.api.close()">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.4"/></svg></button>
    </header>

    <section class="view on" id="view-notes">
      <div class="tools">
        <label class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="q" placeholder="Buscar en tus notas" autocomplete="off">
        </label>
        <button class="chip on" id="acts" title="Mostrar también lo que abriste, cerraste, buscaste, las tareas y lo que le pediste a Claude">Actividad</button>
        <span class="count" id="count"></span>
        <button class="chip" onclick="pywebview.api.open_file()" title="Abrir el archivo de notas en el Bloc de notas">Archivo</button>
      </div>
      <div class="list" id="list"></div>
      <div class="compose">
        <textarea id="note" rows="1" placeholder="Escribe una nota…"></textarea>
        <button class="send" id="addNote" title="Guardar nota" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </section>

    <section class="view" id="view-tasks">
      <div class="tools">
        <span class="hint">Di <b>«Asistemis, agregá la tarea…»</b>, <b>«estoy haciendo la tarea 3»</b> o <b>«terminé la tarea 3»</b> — o arrastra las tarjetas.</span>
      </div>
      <div class="board" id="board">
        <div class="col" data-status="pendiente">
          <div class="colhead"><span class="dot"></span>Pendientes<span class="n"></span></div>
          <form class="add" id="addTask" autocomplete="off">
            <input id="taskText" placeholder="Nueva tarea…">
            <button title="Agregar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          </form>
          <div class="cards"></div>
        </div>
        <div class="col" data-status="progreso">
          <div class="colhead"><span class="dot"></span>En progreso<span class="n"></span></div>
          <div class="cards"></div>
        </div>
        <div class="col" data-status="hecha">
          <div class="colhead"><span class="dot"></span>Finalizadas<span class="n"></span></div>
          <div class="cards"></div>
        </div>
      </div>
    </section>

    <section class="view" id="view-claude">
      <div class="tools">
        <div class="status"><div class="dot ok" id="sdot"></div><span id="stext">Listo</span></div>
        <div class="grow"></div>
        <button class="chip" onclick="pywebview.api.claude_new()">Nueva conversación</button>
      </div>
      <div class="chat" id="chat">
        <div class="empty" id="cempty"><b>¿Qué necesitas?</b>Di «Asistemis, ejecutá…» o escribe una orden abajo.</div>
      </div>
      <div class="compose">
        <textarea id="order" rows="1" placeholder="Escribe una orden para Claude…"></textarea>
        <button class="send" id="sendOrder" title="Enviar" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </section>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const api = () => pywebview.api;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const TITLES = {notes: "Notas", tasks: "Tareas", claude: "Claude"};
const STATUS_ORDER = ["pendiente", "progreso", "hecha"];
const STATUS_NAMES = {pendiente: "Pendiente", progreso: "En progreso", hecha: "Finalizada"};

/* ---------- navegación y encendido ---------- */
function showView(view) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  for (const v in TITLES) $("view-" + v).classList.toggle("on", v === view);
  $("title").textContent = TITLES[view];
  ({notes: $("note"), tasks: $("taskText"), claude: $("order")})[view].focus();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => showView(b.dataset.view));
function showTab(view) { showView(view === "notes" ? "notes" : view); }
function setPower(on) {
  $("pdot").className = "dot" + (on ? " on" : "");
  $("ptext").textContent = on ? "Encendido" : "Apagado";
}
$("power").onclick = () => api().power();

/* ---------- notas ---------- */
let notes = [], notesVersion = null, showActivity = true;
const ICONS = {
  abrir: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7M10 14L21 3M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>',
  cerrar: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  buscar: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  tarea: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/></svg>',
};
const VERBS = {abrir: "Abriste", cerrar: "Cerraste", buscar: "Buscaste"};

function dayLabel(iso) {
  if (!iso) return "Sin fecha";
  const d = new Date(iso + "T12:00:00"), today = new Date(); today.setHours(12, 0, 0, 0);
  const diff = Math.round((today - d) / 864e5);
  if (diff === 0) return "Hoy";
  if (diff === 1) return "Ayer";
  return d.toLocaleDateString("es", {weekday: "long", day: "numeric", month: "long",
    ...(d.getFullYear() !== today.getFullYear() ? {year: "numeric"} : {})});
}
function highlight(text, q) {
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + highlight(text.slice(i + q.length), q);
}
function activityLine(n, q) {
  const t = n.time ? `<span class="t">${n.time}</span>` : "";
  const task = n.tag.match(/^tarea #(\d+)(?: (\w+))?$/);
  if (task) {
    const what = task[2] ? `<span class="tag">#${task[1]}</span> → ${STATUS_NAMES[task[2]] || task[2]}` : `Nueva tarea <span class="tag">#${task[1]}</span>`;
    return `<div class="action">${ICONS.tarea}<span>${what}: <b>${highlight(n.text, q)}</b></span>${t}</div>`;
  }
  const link = n.tag === "buscar";
  return `<div class="action${link ? " link" : ""}" ${link ? `data-search="${esc(n.text)}" title="Buscar de nuevo"` : ""}>
    ${ICONS[n.tag]}<span>${VERBS[n.tag]} <b>${highlight(n.text, q)}</b></span>${t}</div>`;
}
const isActivity = n => n.tag && !n.tag.startsWith("orden");

function renderNotes(keepScroll) {
  const list = $("list"), q = $("q").value.trim().toLowerCase();
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  const shown = notes.filter(n => (showActivity || !n.tag) && (!q || n.text.toLowerCase().includes(q)));
  const own = notes.filter(n => !n.tag).length;
  $("count").textContent = q ? `${shown.length} de ${notes.length}` : `${own} nota${own === 1 ? "" : "s"}`;
  $("nNotes").textContent = own || "";
  if (!shown.length) {
    list.innerHTML = q ? `<div class="empty"><b>Sin resultados</b>No hay notas con «${esc(q)}».</div>`
                       : `<div class="empty"><b>Todavía no hay notas</b>Di «Asistemis, anota…» o escribe una abajo.</div>`;
    return;
  }
  let html = "", day = null;
  for (const n of shown) {
    if (n.date !== day) { day = n.date; html += `<div class="day">${dayLabel(day)}</div>`; }
    if (isActivity(n) && (VERBS[n.tag] || n.tag.startsWith("tarea"))) { html += activityLine(n, q); continue; }
    const order = n.tag.startsWith("orden");
    const label = order ? `<span class="label">CLAUDE · ${n.tag.includes("voz") ? "POR VOZ" : "ESCRITA"}</span>` : "";
    html += `<div class="note${order ? " order" : ""}" data-i="${n.i}">
      <div class="bubble">${label}${highlight(n.text, q)}</div>
      <div class="meta"><div class="acts"><button class="mini" data-task title="Crear una tarea pendiente con esta nota">→ Tarea</button><button class="mini" data-copy>Copiar</button><button class="mini" data-del>Borrar</button></div>${n.time ? n.time : ""}</div></div>`;
  }
  const top = list.scrollTop;
  list.innerHTML = html;
  list.scrollTop = keepScroll && !nearBottom ? top : list.scrollHeight;
}
async function loadNotes(force) {
  const v = await api().notes_version();
  if (!force && v === notesVersion) return;
  notesVersion = v;
  notes = await api().notes();
  renderNotes(!force);
}
function confirmButton(button, label, action) {  // primer clic pide confirmación, el segundo actúa
  if (!button.classList.contains("danger")) {
    button.classList.add("danger"); button.textContent = "¿Seguro?";
    setTimeout(() => { button.classList.remove("danger"); button.textContent = label; }, 3000);
    return;
  }
  action();
}
$("list").addEventListener("click", async e => {
  const note = e.target.closest(".note"), search = e.target.closest("[data-search]");
  if (search) return api().search(search.dataset.search);
  if (!note) return;
  const n = notes.find(x => x.i === +note.dataset.i);
  if (e.target.matches("[data-task]")) {
    if (e.target.dataset.done) return;  // ya se convirtió: evita tareas repetidas por doble clic
    e.target.dataset.done = "1";
    const id = await api().add_task(n.text);
    e.target.textContent = `✓ Tarea #${id}`;
    loadTasks(true);
    setTimeout(() => { e.target.textContent = "→ Tarea"; delete e.target.dataset.done; }, 2500);
  } else if (e.target.matches("[data-copy]")) {
    await navigator.clipboard.writeText(n.text);
    e.target.textContent = "Copiada"; setTimeout(() => e.target.textContent = "Copiar", 1200);
  } else if (e.target.matches("[data-del]")) {
    confirmButton(e.target, "Borrar", async () => { await api().delete_note(n.i, n.raw); loadNotes(true); });
  }
});
$("q").addEventListener("input", () => renderNotes(false));
$("acts").onclick = () => { showActivity = !showActivity; $("acts").classList.toggle("on", showActivity); renderNotes(false); };

/* ---------- tareas ---------- */
let tasks = [], tasksVersion = null, dragged = null;
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso), label = dayLabel(iso.slice(0, 10));
  return (label === "Hoy" || label === "Ayer" ? label.toLowerCase() : d.toLocaleDateString("es", {day: "numeric", month: "short"}))
    + " " + iso.slice(11, 16);
}
function renderTasks() {
  for (const col of document.querySelectorAll(".col")) {
    const status = col.dataset.status, mine = tasks.filter(t => t.status === status);
    if (status === "hecha") mine.sort((a, b) => b.updated.localeCompare(a.updated));
    col.querySelector(".n").textContent = mine.length || "";
    col.querySelector(".cards").innerHTML = mine.length ? mine.map(t => {
      const i = STATUS_ORDER.indexOf(t.status);
      return `<div class="card" draggable="true" data-id="${t.id}">
        <div class="top"><span class="num">#${t.id}</span><span class="date">${when(t.status === "pendiente" ? t.created : t.updated)}</span>
          <div class="cacts">
            ${i > 0 ? `<button data-move="${STATUS_ORDER[i - 1]}" title="Mover a ${STATUS_NAMES[STATUS_ORDER[i - 1]]}">←</button>` : ""}
            ${i < 2 ? `<button data-move="${STATUS_ORDER[i + 1]}" title="Mover a ${STATUS_NAMES[STATUS_ORDER[i + 1]]}">→</button>` : ""}
            <button data-del title="Borrar">✕</button>
          </div></div>
        <div class="text">${esc(t.text)}</div></div>`;
    }).join("") : `<div class="colempty">${status === "pendiente" ? "Sin tareas pendientes" : "Arrastra una tarea aquí"}</div>`;
  }
  const open = tasks.filter(t => t.status !== "hecha").length;
  $("nTasks").textContent = open || "";
}
async function loadTasks(force) {
  const v = await api().tasks_version();
  if (!force && v === tasksVersion) return;
  tasksVersion = v;
  tasks = await api().tasks();
  renderTasks();
}
async function moveTask(id, status) {
  const t = tasks.find(x => x.id === id);
  if (!t || t.status === status) return;
  t.status = status; t.updated = new Date().toISOString().slice(0, 16); renderTasks();  // al instante
  await api().move_task(id, status);
  loadTasks(true);
}
$("board").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  const id = +card.dataset.id;
  if (e.target.dataset.move) moveTask(id, e.target.dataset.move);
  else if (e.target.matches("[data-del]"))
    confirmButton(e.target, "✕", async () => { await api().delete_task(id); loadTasks(true); });
});
$("board").addEventListener("dragstart", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  dragged = +card.dataset.id; card.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", card.dataset.id);
});
$("board").addEventListener("dragend", e => { e.target.closest(".card")?.classList.remove("dragging"); document.querySelectorAll(".col").forEach(c => c.classList.remove("over")); });
for (const col of document.querySelectorAll(".col")) {
  col.addEventListener("dragover", e => { if (dragged !== null) { e.preventDefault(); col.classList.add("over"); } });
  col.addEventListener("dragleave", e => { if (!col.contains(e.relatedTarget)) col.classList.remove("over"); });
  col.addEventListener("drop", e => { e.preventDefault(); col.classList.remove("over"); if (dragged !== null) moveTask(dragged, col.dataset.status); dragged = null; });
}
$("addTask").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("taskText").value.trim();
  if (!text) return;
  $("taskText").value = "";
  await api().add_task(text);
  loadTasks(true);
});

/* ---------- escribir notas y órdenes ---------- */
function composer(input, button, submit) {
  const resize = () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; button.disabled = !input.value.trim(); };
  const go = () => { const text = input.value.trim(); if (!text) return; input.value = ""; resize(); submit(text); };
  input.addEventListener("input", resize);
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); go(); } });
  button.addEventListener("click", go);
}
composer($("note"), $("addNote"), async text => { await api().add_note(text); loadNotes(true); });
composer($("order"), $("sendOrder"), text => api().claude_send(text));

/* ---------- Claude (espejo del panel) ---------- */
function markdown(text) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const item = /^\s*(?:[-*•]|\d+[.)])\s+/;
  return text.trim().split(/\n{2,}/).map(block => {
    let html = "", list = [], para = [];
    const flush = () => {
      if (para.length) html += "<p>" + para.map(inline).join("<br>") + "</p>";
      if (list.length) html += "<ul>" + list.map(l => "<li>" + inline(l) + "</li>").join("") + "</ul>";
      para = []; list = [];
    };
    for (const line of block.split("\n")) {
      if (item.test(line)) { if (para.length) flush(); list.push(line.replace(item, "")); }
      else { if (list.length) flush(); para.push(line); }
    }
    flush();
    return html;
  }).join("");
}
function addMessage(role, text, source) {
  $("cempty")?.remove();
  const m = document.createElement("div");
  m.className = "msg " + role;
  if (role === "claude") m.innerHTML = markdown(text);
  else if (role === "you") m.innerHTML = (source ? `<span class="src">${esc(source)}</span>` : "") + esc(text);
  else m.textContent = text;
  $("chat").appendChild(m);
  $("chat").scrollTop = $("chat").scrollHeight;
}
function setStatus(text, kind) { $("stext").textContent = text; $("sdot").className = "dot " + kind; }
function focusInput() {}

  setPower(await api().power_state());
  loadNotes(true); loadTasks(true);
  setInterval(() => { if (!document.hidden) { loadNotes(false); loadTasks(false); } }, 1500);  // cambios por voz o de Claude
});
