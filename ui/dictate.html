<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dictado</title>
<style>
/*BASE*/
.card { display: flex; flex-direction: column; padding: 14px 16px 12px; gap: 8px; }
.head { display: flex; align-items: center; gap: 10px; }
.title { font: 600 19px/1.2 "Segoe UI Variable Display", "Segoe UI", sans-serif; }
.brand { margin-left: auto; font-size: 15px; font-weight: 600; color: var(--faint); letter-spacing: .02em; }
.timer { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 17px; margin-left: 6px; }
.hint { color: var(--muted); font-size: 15.5px; }
.canvas-wrap { display: none; }
.is-live .canvas-wrap { display: block; }
canvas { width: 100%; height: 36px; display: block; }
.text {
  flex: 1; min-height: 120px; max-height: 200px; overflow-y: auto;
  padding: 10px 12px; border-radius: 12px;
  background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--line);
  font-size: 18px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
  user-select: text;
}
.text::-webkit-scrollbar { width: 8px; }
.text::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
.placeholder { color: var(--faint); }
.foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: auto; }
</style>
</head>
<body>
<div class="glass card is-live" id="card">
  <div class="head">
    <div class="dot rec" id="dot"></div>
    <div class="title" id="title">Transcribiendo…</div>
    <div class="timer" id="timer"></div>
    <div class="brand">DICTADO</div>
  </div>
  <div class="hint" id="hint">Se guarda como nota con el tag [dictado]</div>
  <div class="canvas-wrap"><canvas id="wave"></canvas></div>
  <div class="text placeholder" id="text">Hablá y el texto aparece acá…</div>
  <div class="foot">
    <button class="btn" onclick="pywebview.api.cancel()">Cancelar</button>
    <button class="btn primary" onclick="pywebview.api.finish()">Listo</button>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const BARS = 40, bars = new Array(BARS).fill(0);
let started = 0, tick = 0;

function start() {
  const card = $("card");
  card.classList.remove("leave");
  card.classList.add("enter", "is-live");
  $("dot").className = "dot rec";
  $("title").textContent = "Transcribiendo…";
  $("hint").textContent = "Se guarda como nota con el tag [dictado]";
  const t = $("text");
  t.textContent = "Hablá y el texto aparece acá…";
  t.classList.add("placeholder");
  t.scrollTop = 0;
  bars.fill(0); draw();
  clearInterval(tick);
  started = Date.now();
  tick = setInterval(() => {
    const s = Math.floor((Date.now() - started) / 1000);
    $("timer").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }, 500);
}

function appendDictation(text) {
  const t = $("text");
  t.classList.remove("placeholder");
  t.textContent = text || "";
  t.scrollTop = t.scrollHeight;  // scroll automático al final
}

function levels(values) {
  for (const v of values) { bars.shift(); bars.push(v); }
  draw();
}

function draw() {
  const c = $("wave"), dpr = devicePixelRatio;
  const w = c.clientWidth * dpr, h = c.clientHeight * dpr;
  if (c.width !== w) { c.width = w; c.height = h; }
  const g = c.getContext("2d");
  g.clearRect(0, 0, w, h);
  const step = w / BARS, bw = Math.max(2, step * .5);
  bars.forEach((v, i) => {
    const bh = Math.max(3 * dpr, v * h);
    g.fillStyle = `rgba(255,255,255,${.35 + v * .65})`;
    g.beginPath();
    g.roundRect(i * step + (step - bw) / 2, (h - bh) / 2, bw, bh, bw / 2);
    g.fill();
  });
}

function leave() {
  $("card").classList.add("leave");
  $("card").classList.remove("is-live");
  clearInterval(tick);
  $("timer").textContent = "";
}
</script>
</body>
</html>
