<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Claude</title>
<style>
/*BASE*/
.panel { display: flex; flex-direction: column; }
.head { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px 18px; cursor: default; }
.name { font: 600 18px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -.02em; }
.status { display: flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px 0 9px; border-radius: 12px;
  background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1px var(--line); font-size: 11.5px; color: var(--muted); }
.status .dot { width: 7px; height: 7px; box-shadow: none; }
.spacer { flex: 1; }
.icon-btn { width: 30px; height: 30px; border-radius: 15px; background: transparent; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: rgba(255,255,255,.7); color: var(--ink); }

.chat { flex: 1; overflow-y: auto; padding: 6px 16px 12px; display: flex; flex-direction: column; gap: 10px; user-select: text; }
.chat::-webkit-scrollbar { width: 8px; }
.chat::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 280px; }
.empty b { display: block; color: var(--ink); font: 600 15px "Segoe UI Variable Display", "Segoe UI", sans-serif; margin-bottom: 4px; }
.msg { max-width: 88%; padding: 9px 13px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; animation: enter .2s both; }
.msg.you { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 5px; }
.msg.claude { align-self: flex-start; background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--line); border-bottom-left-radius: 5px; white-space: normal; }
.msg.error { align-self: flex-start; background: rgba(229,72,77,.1); color: #b4232a; }
.msg.meta { align-self: center; background: none; color: var(--faint); font-size: 11.5px; padding: 2px; }
.src { display: block; font-size: 10.5px; opacity: .6; margin-bottom: 2px; }
.msg code { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; background: rgba(0,0,0,.06); padding: 1px 4px; border-radius: 4px; }
.msg p { margin: 0 0 6px; } .msg p:last-child { margin: 0; }
.msg ul { margin: 2px 0 6px; padding-left: 18px; } .msg ul:last-child { margin-bottom: 0; }

.compose { margin: 0 12px 10px; display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 14px;
  background: var(--glass-strong); border-radius: 18px; box-shadow: inset 0 0 0 1px var(--line), 0 2px 10px rgba(0,0,0,.05); }
textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; font: inherit; font-size: 13.5px; color: var(--ink);
  max-height: 120px; padding: 6px 0; user-select: text; }
textarea::placeholder { color: var(--faint); }
.send { width: 34px; height: 34px; border-radius: 17px; background: var(--ink); color: #fff; display: grid; place-items: center; flex: none; transition: opacity .15s; }
.send:disabled { opacity: .3; cursor: default; }
.hint { text-align: center; font-size: 11px; color: var(--faint); padding: 0 0 10px; }
</style>
</head>
<body>
<div class="glass panel">
  <div class="head pywebview-drag-region">
    <div class="name">Claude</div>
    <div class="status" id="status"><div class="dot ok" id="sdot"></div><span id="stext">Listo</span></div>
    <div class="spacer"></div>
    <button class="btn" onclick="pywebview.api.new_conversation()">Nueva</button>
    <button class="icon-btn" title="Cerrar" onclick="pywebview.api.close()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="chat" id="chat">
    <div class="empty" id="empty"><b>¿Qué necesitas?</b>Di «Asistemis, ejecuta…» o escribe una orden abajo.</div>
  </div>
  <div class="compose">
    <textarea id="input" rows="1" placeholder="Escribe una orden…"></textarea>
    <button class="send" id="send" title="Enviar" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
  <div class="hint">Enter envía · Shift+Enter nueva línea · se guarda en tus notas</div>
</div>
<script>
const $ = id => document.getElementById(id);
const input = $("input"), send = $("send"), chat = $("chat");

function esc(s) { return s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function markdown(text) {  // lo justo: párrafos, listas, **negrita**, `código`
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const item = /^\s*(?:[-*•]|\d+[.)])\s+/;
  return text.trim().split(/\n{2,}/).map(block => {
    // agrupa líneas seguidas: las de lista en <ul>, el resto en párrafos
    let html = "", list = [], para = [];
    const flush = () => {
      if (para.length) html += "<p>" + para.map(inline).join("<br>") + "</p>";
      if (list.length) html += "<ul>" + list.map(l => "<li>" + inline(l) + "</li>").join("") + "</ul>";
      para = []; list = [];
    };
    for (const line of block.split("\n")) {
      if (item.test(line)) { if (para.length) flush(); list.push(line.replace(item, "")); }
      else { if (list.length) flush(); para.push(line); }
    }
    flush();
    return html;
  }).join("");
}

function addMessage(role, text, source) {
  $("empty")?.remove();
  const m = document.createElement("div");
  m.className = "msg " + role;
  if (role === "claude") m.innerHTML = markdown(text);
  else if (role === "you") m.innerHTML = (source ? `<span class="src">${esc(source)}</span>` : "") + esc(text);
  else m.textContent = text;
  chat.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
}
function setStatus(text, kind) { $("stext").textContent = text; $("sdot").className = "dot " + kind; }
function focusInput() { setTimeout(() => input.focus(), 50); }

function resize() { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; send.disabled = !input.value.trim(); }
function submit() {
  const text = input.value.trim();
  if (!text) return;
  input.value = ""; resize();
  pywebview.api.send(text);
}
input.addEventListener("input", resize);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } });
send.addEventListener("click", submit);
document.addEventListener("keydown", e => { if (e.key === "Escape") pywebview.api.close(); });
</script>
</body>
</html>
